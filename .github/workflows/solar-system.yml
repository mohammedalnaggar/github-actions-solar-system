name: Solar System Workflow

on: 
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'
env:
  MONGO_URI: mongodb+srv://supercluster.d83jj.mongodb.net/superData
  MONGO_USERNAME: superuser
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
    
jobs:
    unit-testing:

        name: Unit Testing
        runs-on: ubuntu-latest
        steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Setup NodeJS Version
          uses: actions/setup-node@v4
          with:
            node-version: 20
        
        - name: Cache Node Modules
          uses: actions/cache@v3
          with:
            path: node_modules
            key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

    
        - name: Install Dependencies
          run: npm install
    
        - name: Unit Testing
          run: npm test
          
        - name: Archive Test Result
          uses: actions/upload-artifact@v4
          if: always()
          with:
            name: Mocha-Test-Result
            path: test-results.xml
    

    code-coverage:
      name: Code-Coverage-Result
      runs-on: ${{ matrix.operating-system }}
      strategy:
        matrix:
          node-version: [ 20]
          operating-system: [ubuntu-latest]
          exclude:
            - node-version: 18
              operating-system: macos-latest
      steps:
        - name: checkout repository
          uses: actions/checkout@v4
        
        - name: setup nodejs version
          uses: actions/setup-node@v4
          with:
            node-version: ${{ matrix.node-version }}

        - name: Cache Node Modules
          uses: actions/cache@v3
          with:
            path: node_modules
            key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

    
        - name: install dependencies
          run: npm install

        - name: run code coverage
          continue-on-error: true
          run: npm run coverage
        
        - name: Archive Code Coverage Result
          uses: actions/upload-artifact@v4
          with:
            name: Code-Coverage-Result-${{ matrix.operating-system }}-Node-${{ matrix.node-version }}
            path: coverage
            retention-days: 5

    containerization:
      name: Docker Build and Push
      runs-on: ubuntu-latest
      needs: [unit-testing, code-coverage]
      steps:
        - name: checkout repository
          uses: actions/checkout@v4
        
        - name: Login to DockerHub
          uses: docker/login-action@v2
          with:
            username: ${{ vars.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}

        - name: Build Docker Image
          uses: docker/build-push-action@v3
          with:
            context: .
            push: false
            tags: ${{ vars.DOCKER_USERNAME }}/solar-system-app:${{ github.sha }}
        
        - name: Docker Test
          run: |
            docker images
            docker run -d --name solar-system-app \
            -p 3000:3000 \
            -e MONGO_URI=${{ env.MONGO_URI }} \
            -e MONGO_USERNAME=${{ env.MONGO_USERNAME }} \
            -e MONGO_PASSWORD=${{ env.MONGO_PASSWORD }} \
            ${{ vars.DOCKER_USERNAME }}/solar-system-app:${{ github.sha }}
            
            sleep 3

            echo "Testing Docker Container... using curl command to check if the application is running"  
            curl -sf http://127.0.0.1:3000/live
        
        - name: Build Docker Image
          uses: docker/build-push-action@v3
          with:
            context: .
            push: true
            tags: ${{ vars.DOCKER_USERNAME }}/solar-system-app:${{ github.sha }}
        